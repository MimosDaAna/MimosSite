# Publica a calculadora no GitHub Pages a cada envio para a branch main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Pasta do repositório onde está o projeto Next.js
        working-directory: Mimos Public Page
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mimos Public Page/package-lock.json

      - run: npm ci

      # Repositório "usuario.github.io" fica na raiz; os demais ficam em /nome-do-repositorio.
      - name: Definir caminho do site
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "BASE_PATH=" >> "$GITHUB_ENV"; else echo "BASE_PATH=/$REPO" >> "$GITHUB_ENV"; fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Mimos Public Page/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
